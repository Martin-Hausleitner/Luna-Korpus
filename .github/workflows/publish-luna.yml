name: Publish modern LUNA build

on:
  push:
    branches: [main]
    paths:
      - 'aster/index.html'
      - 'aster/src/luna.css'
      - 'aster/src/luna.js'
      - 'aster/src/luna-modern.js'
      - 'build.py'
      - '.github/workflows/publish-luna.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-modern-luna-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build current original-Aster LUNA desktop
        run: python3 build.py
      - name: Verify original applications and Aster source
        run: python3 qa/verify.py
      - name: Commit generated Pages files
        run: |
          git config user.name "LUNA Build"
          git config user.email "luna-build@users.noreply.github.com"
          git add Luna-Korpus.html index.html
          if git diff --cached --quiet; then
            echo "Generated Pages files already current."
          else
            git commit -m "Build current modern LUNA Pages"
            git push
          fi
