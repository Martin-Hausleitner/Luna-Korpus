name: Rebuild LUNA Pages

on:
  push:
    branches:
      - release/aster-originals-20260914
    paths:
      - 'theme-source/src/luna-integration.js'
      - 'theme-source/src/luna-chrome.css'
      - 'theme-source/index.html'
      - 'build.py'
      - '.github/workflows/rebuild-luna.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-luna-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build LUNA from real Aster source
        run: python3 build.py
      - name: Commit generated Pages files
        run: |
          git config user.name "LUNA Build"
          git config user.email "luna-build@users.noreply.github.com"
          git add Luna-Korpus.html Luna.html index.html
          if git diff --cached --quiet; then
            echo "Generated Pages files already current."
          else
            git commit -m "Build modern LUNA Pages"
            git push
          fi
