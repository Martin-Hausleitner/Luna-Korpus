name: Aster originals build
on:
  workflow_dispatch:
  push:
    branches: [main, build/aster-originals-20260914]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build themed upstream Aster
        run: python3 build.py
      - name: Verify original applications and native Aster source
        run: python3 qa/verify.py
      - name: Package original-app delivery and evidence
        uses: actions/upload-artifact@v4
        with:
          name: luna-originals-evidence
          path: |
            qa/
            Luna-Korpus.html
            Luna-Korpus.astertheme
            app-mapping.json
            README.md
            LICENSE
            PROVENANCE.json
          retention-days: 14
