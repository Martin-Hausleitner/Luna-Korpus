        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, 2048 / bitmap.width, 2048 / bitmap.height), canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        bitmap.close();
        callback(canvas.toDataURL('image/png'));
    }
    catch (error) {
        this.notify('That image could not be decoded.', true);
    } }; input.click(); }

    about() { this.modal('A little more possible.', `<div style="display:flex;align-items:center;gap:15px;margin:22px 0"><div class="brand-mark" style="width:48px;height:48px;font-size:32px">M</div><div><strong style="font-size:22px;font-weight:600">Meridian Office</strong><div style="font-size:11px;color:var(--muted);margin-top:5px">Write. Calculate. Present.</div></div></div><p>A local-first Office-style workspace, made with plain HTML, CSS, JavaScript, and a native WebGPU compositor. No UI framework, no rendering library, no runtime dependencies.</p><p>This is an independent implementation, not a Microsoft product. It includes a working editor core—not full Microsoft Office feature or format parity.</p><div class="onboarding">${icon('lock')}<p>No accounts, analytics, cloud uploads, or external fonts. Workspace data lives in IndexedDB on this device.</p></div><div class="modal-footer"><button class="btn primary" data-close>Back to your workspace</button></div>`); }
